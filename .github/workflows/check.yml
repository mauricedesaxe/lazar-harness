name: Rust checks

on:
  pull_request:
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "lint-baselines/**"
      - ".github/workflows/check.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "lint-baselines/**"
      - ".github/workflows/check.yml"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy -- -D warnings
      - name: test
        run: cargo test
      - name: dogfood
        run: |
          cargo build
          files=$(find src -name '*.rs' ! -path '*/testdata/*' | sort)
          ./target/debug/harness-check check $files || test $? -eq 1
      - name: build
        run: cargo build --release
