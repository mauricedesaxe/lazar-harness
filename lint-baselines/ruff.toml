# Harness baseline for Python. Distilled from chartly's ruff.toml and the
# job-finder CI gate, widened from their hand-picked subfamilies to full
# rule families. Repos extend this file and override anything they must.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "S", "RUF"]
ignore = [
    "E501",
    "UP040",
]

[lint.per-file-ignores]
"**/tests/**" = ["S101", "E402"]
"**/test_*.py" = ["S101", "E402"]
"**/*_test.py" = ["S101", "E402"]
"**/conftest.py" = ["S101"]
